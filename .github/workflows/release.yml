name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer, optionally prefixed with v (numeric components <= 65535)'
        required: true
        default: 'v0.1.0'
      prerelease:
        description: 'Publish as Pre-release'
        type: boolean
        default: false
      draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release.py version

  build-windows:
    needs: validate
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_ARCH: ${{ matrix.arch }}
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install nsis 7zip -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Packaging tools installation failed" }
          "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          "C:\Program Files\7-Zip" >> $env:GITHUB_PATH
      - name: Install Wails CLI
        env:
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install pinned architecture-compatible cgo toolchain
        shell: pwsh
        run: ./scripts/release-windows.ps1
      - name: Prepare CI-only version metadata
        run: python scripts/release.py metadata
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build binary and NSIS installer with cgo
        env:
          GOARCH: ${{ matrix.arch }}
        shell: pwsh
        run: |
          task windows:create:nsis:installer "ARCH=$env:RELEASE_ARCH" CGO_ENABLED=1 EXTRA_TAGS=sqliteonly INSTALL_SCOPE=user
          if ($LASTEXITCODE -ne 0) { throw "Windows build/NSIS packaging failed" }
          python scripts/release.py package windows
          if ($LASTEXITCODE -ne 0) { throw "Windows artifact validation failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist-artifacts/*
          if-no-files-found: error

  build-macos:
    needs: validate
    runs-on: macos-14
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Wails CLI
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Prepare CI-only version metadata
        run: python scripts/release.py metadata
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build universal app and DMG without host rebuild
        run: |
          set -euo pipefail
          task darwin:package:universal EXTRA_TAGS=sqliteonly
          python scripts/release.py cpu bin/VPro.app/Contents/MacOS/VPro --format macho --arch universal
          task darwin:create:dmg
          python scripts/release.py package macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist-artifacts/*
          if-no-files-found: error

  build-linux:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_ARCH: ${{ matrix.arch }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '1'
      CC: gcc
      CXX: g++
      NO_STRIP: '1'
      GIT_COMMITTER_NAME: VPro
      GIT_COMMITTER_EMAIL: noreply@github.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Require native runner and install packaging dependencies
        run: |
          set -euo pipefail
          test "$(go env GOHOSTARCH)" = "$RELEASE_ARCH"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev pkg-config build-essential file patchelf desktop-file-utils squashfs-tools
      - name: Install Wails CLI
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Prepare CI-only version metadata
        run: python scripts/release.py metadata
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build native AppImage and deb
        run: |
          set -euo pipefail
          task linux:create:appimage linux:create:deb "ARCH=$RELEASE_ARCH" EXTRA_TAGS=sqliteonly
          python scripts/release.py package linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist-artifacts/*
          if-no-files-found: error

  release:
    needs: [validate, build-windows, build-macos, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_DRAFT: ${{ inputs.draft }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Require exact assets, architecture witnesses and checksums
        run: |
          set -euo pipefail
          python scripts/release.py manifest release-assets
          python scripts/release.py release-manifest release-assets --output release-assets/release-manifest.json --base-manifest site/release-manifest.json
      - name: Refuse an existing tag built from different source
        run: python scripts/release.py source-tag
      - name: Create release with every validated asset
        run: |
          set -euo pipefail
          mapfile -t assets < release-assets.txt
          flags=()
          if [ "$RELEASE_DRAFT" = "true" ]; then flags+=(--draft); fi
          if [ "$RELEASE_PRERELEASE" = "true" ] || [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${assets[@]}" release-assets/release-manifest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "VPro $RELEASE_TAG" --notes "Windows amd64/arm64 EXE, ZIP and NSIS; macOS universal DMG and ZIP; Linux amd64/arm64 AppImage, deb and tar. Verify downloads against SHA256SUMS.txt and release-manifest.json. macOS VPro.app is ad-hoc signed, not notarized." "${flags[@]}"
      - name: Verify remotely attached names and bytes
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > release-remote.json
          python scripts/release.py remote release-remote.json --require-release-manifest
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-downloaded
          python scripts/release.py verify release-downloaded --manifest release-assets/SHA256SUMS.txt --release-manifest release-assets/release-manifest.json
      - uses: actions/setup-node@v4
        if: inputs.draft != true
        with:
          node-version: '22'
      - name: Build Pages portal with verified release-manifest.json
        if: inputs.draft != true
        run: |
          set -euo pipefail
          cp release-assets/release-manifest.json site/release-manifest.json
          node scripts/build-docs-src.mjs
          node site/build.mjs
      - name: Upload Pages artifact
        if: inputs.draft != true
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/dist'
      - name: Deploy updated release portal to GitHub Pages
        if: inputs.draft != true
        uses: actions/deploy-pages@v4
